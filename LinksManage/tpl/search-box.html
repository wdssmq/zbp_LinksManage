<div id="search-box" class="ui-draggable fade">
  <p style="padding:5px;background:#f0f0f0;text-align:center;">
    <input id="search-inp" name="search-inp" style="width:250px;" type="text" placeholder="可使用ID，标题关键词，文件名……"
      autocomplete="off"><input type="button" class="button" id="search-btn" value="查询">
    <input type="hidden" value="关闭" class="buttons" onclick="$('#search-box').slideToggle();" />
  </p>
  <div id="search-con">
    <select style="width:100%;" id="search-result" name="search-result" size="7" multiple="multiple"></select>
  </div>
  <div id="search-view"></div>
  <div id="search-tip" style="float:left;">点击空白处并按住可移动,双击关闭</div>
  <div id="search-do" style="float:right;"><input disabled id="search-fill" type="button" value="添加">
  </div>
</div>
